[project]
name = "kodiak-ai"
dynamic = ["version"]
description = "Approval-gated software engineering automation with a deterministic local workflow"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Sham Ganeshan SB" }]
keywords = [
    "ai",
    "automation",
    "cli",
    "developer-tools",
    "software-engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "aiohttp>=3.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "httpx>=0.27",
    "redis>=5.0",
    "celery>=5.4",
    "structlog>=24.2",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "python-jose[cryptography]>=3.3",
    "tomli-w>=1.0",
    "typer>=0.12",
    "rich>=13.7",

    "bcrypt>=4.3.0,<5.0.0",
    "tenacity>=8.5",
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]

dev = [
    "build>=1.2",
    "twine>=5.1",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

rag = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "openai>=1.0",
]

security = [
    "bandit>=1.7",
]

[project.scripts]
kodiak = "kodiak.cli.app:app"

[project.urls]
Homepage = "https://github.com/ShamGaneshan2008/Kodiak"
Repository = "https://github.com/ShamGaneshan2008/Kodiak"
Issues = "https://github.com/ShamGaneshan2008/Kodiak/issues"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kodiak"]

[tool.hatch.build.targets.sdist]
include = [
    "/kodiak",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]
exclude = ["/.env*"]

[tool.hatch.version]
path = "kodiak/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "UP047"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = ".kodiak/pytest_cache"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
ignore_missing_imports = true
